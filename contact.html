<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }
        .wrapper {
            position: relative;
            width: 100%;
            height: 200vh; /* Ensures scrolling */
            background: 
                url('1.png') no-repeat center top,
                url('2.png') no-repeat center bottom;
            background-size: cover, cover;
            background-blend-mode: lighten; /* Adjust blend mode as needed */
        }
        /* Content Section */
        .content {
            position: absolute;
            top: 100vh; /* Ensure it appears after background */
            left: 10%;
            width: 80%;
            text-align: left;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .title {
            font-size: 2.5rem;
            margin: 1rem 0;
        }
        .subtitle {
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        .button-container {
            display: flex;
            justify-content: left;
            gap: 1rem;
            margin-top: 2rem;
        }
        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Content Section -->
        <div class="content" id="main-content">
            <h1 class="title">Hi, my name is 👋</h1>
            <h2 class="title">Jaida Lebron</h2>
            <p class="subtitle">
                I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
                I’d be happy to connect with you!
            </p>
            <div class="button-container">
                <a href="https://github.com/EJL20/" class="button" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/jaida-lebron/" class="button" target="_blank">LinkedIn</a>
                <a href="https://drive.google.com/file/d/14tbsoaDctrTKQeVzu-IpsGaRGY7VxXkU/view" class="button" target="_blank">Resume</a>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var contentElement = document.getElementById("main-content");
            if (contentElement) {
                contentElement.scrollIntoView({ behavior: "smooth" });
            }
        });
    </script>
</body>
</html>
