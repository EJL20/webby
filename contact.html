<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ffd6e7, #fde7ff);
            overflow-x: hidden;
        }

       /* Wrapper to ensure proper positioning */
/* Wrapper to ensure proper positioning */
.wrapper {
    position: relative;
    width: 100%;
    height: 200vh; /* Ensures scrolling */
}

/* Top Image (Clouds - 1.png) */
.background-top {
<div class="overlay-transition"></div>

    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: url('1.png') no-repeat center center;
    background-size: cover;
    z-index: 2;
    opacity: 1; /* Keep fully visible */
}
<!-- Dreamy Cloud Overlay -->
<div class="overlay-transition"></div>



/* Blending Area - Smooth transition */
.blend-area {
    position: absolute;
    top: 95vh; /* Start blending just before 2.png */
    left: 0;
    width: 100%;
    height: 5vh; /* Creates a fade effect */
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 10%, rgba(253, 231, 255, 0.5) 90%);
    z-index: 3;
}
<!-- Bottom Image -->
<div class="background-bottom"></div>
/* Bottom Image (2.png) */
.background-bottom {
    position: absolute;
    top: 100vh; /* Immediately after blend */
    left: 0;
    width: 100%;
    height: 100vh;
    background: url('2.png') no-repeat center center;
    background-size: cover;
opacity: 1; /* Make sure it's visible */
    z-index: 1; /* Lower than the top image */
}

/* Content Section */
.content {
    position: absolute;
    top: 120vh; /* Ensure it appears after background */
    left: 10%;
    width: 80%;
    text-align: left;
    color: white;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    z-index: 4;
}

        /* Rise Effect */
        @keyframes riseEffect {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rise-text {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .rise-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .title {
            font-size: 2.5rem;
            margin: 1rem 0;
        }

        .subtitle {
            font-size: 1.2rem;
            margin: 1rem 0;
        }

        .button-container {
            display: flex;
            justify-content: left;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Top Image -->
        <div class="background-top"></div>

        <!-- Blending Area -->
        <div class="blend-area"></div>

        <!-- Bottom Image -->
        <div class="background-bottom"></div>

        <!-- Content Section (Placed on 2.png) -->
        <div class="content">
            <div class="rise-text"> <!-- Apply animation here -->
                <h1 class="title">Hi, my name is 👋</h1>
                <h2 class="title">Jaida Lebron</h2>
                <p class="subtitle">
                    I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
                    I’d be happy to connect with you!
                </p>
            </div>

            <div class="button-container">
                <div class="button-container">
    <a href="https://github.com/EJL20/" class="button" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/jaida-lebron/" class="button" target="_blank">LinkedIn</a>
    <a href="https://drive.google.com/file/d/14tbsoaDctrTKQeVzu-IpsGaRGY7VxXkU/view" class="button" target="_blank">Resume</a>
</div>

        </div>
    </div>

    <script>
        // Function to detect if element is in viewport
        function isInViewport(element) {
            const rect = element.getBoundingClientRect();
            return rect.top < window.innerHeight && rect.bottom >= 0;
        }

        function handleScroll() {
            const riseText = document.querySelector('.rise-text');
            if (isInViewport(riseText)) {
                riseText.classList.add('visible');
            }
        }

        // Listen for scroll event
        document.addEventListener("scroll", handleScroll);
        // Also trigger on page load in case it's already visible
        window.addEventListener("load", handleScroll);

// Function to automatically scroll to the bottom image after a few seconds
function autoScrollToBottom() {
    setTimeout(() => {
        window.scrollTo({
            top: window.innerHeight, // Scroll to the bottom image
            behavior: "smooth" // Smooth transition effect
        });
    }, 2000); // 3-second delay before scrolling
}

// Run the auto-scroll effect when the page loads
window.addEventListener("load", autoScrollToBottom);

    </script>
</body>
</html>
