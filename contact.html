<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron - Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2a2a72, #009ffd);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        /* Wrapper */
        .wrapper {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Typography */
        .title {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-top: 1rem;
            font-weight: 300;
        }

        /* Buttons */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            color: white;
            background: #4b0082;
            transition: all 0.3s ease-in-out;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .button:hover {
            background: #6a0dad;
            border-color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1 class="title">Hi, I'm Jaida Lebron 👋</h1>
        <p class="subtitle">
            I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
            I’d be happy to connect with you!
        </p>
        <div class="button-container">
            <a href="https://github.com/EJL20/" class="button" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/jaida-lebron/" class="button" target="_blank">LinkedIn</a>
            <a href="https://drive.google.com/file/d/14tbsoaDctrTKQeVzu-IpsGaRGY7VxXkU/view" class="button" target="_blank">Resume</a>
        </div>
    </div>
</body>
</html>
