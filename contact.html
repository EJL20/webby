<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ffd6e7, #fde7ff);
            overflow-x: hidden;
        }

        .wrapper {
            position: relative;
            width: 100%;
            height: 200vh; /* Adjusted for two full sections */
        }

        /* Top Image (1.png) */
        .background-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh; /* Full viewport height */
            background: url('1.png') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Blending Area */
        .blend-area {
            position: absolute;
            top: 95vh; /* Start blending before transition */
            left: 0;
            width: 100%;
            height: 5vh; /* Smooth transition height */
          background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 20%, rgba(253, 231, 255, 0.3) 80%, rgba(253, 231, 255, 0));
            z-index: 2;
        }

        /* Bottom Image (2.png) */
        .background-bottom {
            position: absolute;
            top: 100vh; /* Start immediately after the blend area */
            left: 0;
            width: 100%;
            height: 100vh; /* Full viewport height */
            background: url('2.png') no-repeat center center;
            background-size: cover;
            z-index: 3;
        }

        /* Content Section */
        .content {
            position: absolute;
            top: 180vh; /* Place content after images */
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 4;
        }

        .title {
            font-size: 2.5rem;
            color: #4b0082;
            margin: 1rem 0;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #6a0dad;
            margin: 1rem 0;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Top Image -->
        <div class="background-top"></div>

        <!-- Blending Area -->
        <div class="blend-area"></div>

        <!-- Bottom Image -->
        <div class="background-bottom"></div>

        <!-- Content Section -->
        <div class="content">
            <h1 class="title">Hi, my name is 👋</h1>
            <h2 class="title">Jaida Lebron</h2>
            <p class="subtitle">
                I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
                I’d be happy to connect with you!
            </p>
            <div class="button-container">
                <a href="#" class="button" target="_blank">🐙 GitHub</a>
                <a href="#" class="button" target="_blank">🔗 LinkedIn</a>
                <a href="#" class="button" target="_blank">📄 Resume</a>
            </div>
        </div>
    </div>
</body>
</html>
