<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Playfair+Display:wght@700&display=swap">
    <style>
        /* General Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #2a2a72, #009ffd);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Navbar */
        .navbar {
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            padding: 15px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 1.2rem;
            transition: color 0.3s ease-in-out;
        }

        .nav-links a:hover {
            color: #f5a623;
        }

        /* Wrapper */
        .wrapper {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-top: 70px; /* Adjust for navbar spacing */
        }

        /* Typography */
        .title {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-top: 1rem;
            font-weight: 300;
        }

        /* Wave Animation */
        .wave {
            display: inline-block;
            animation: waveAnimation 1s ease-in-out infinite alternate;
        }

        @keyframes waveAnimation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(20deg); }
        }

        /* Buttons */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            color: white;
            background: #4b0082;
            transition: all 0.3s ease-in-out;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .button:hover {
            background: #6a0dad;
            border-color: white;
        }

        /* Footer */
        .footer {
            margin-top: 2rem;
            text-align: center;
        }

        .footer .name {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            font-weight: bold;
        }

        .footer .email {
            font-size: 1rem;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .button {
                width: 100%;
                text-align: center;
            }

            .nav-links {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div class="wrapper">
        <h1 class="title">Hi, I'm Jaida Lebron <span class="wave">👋</span></h1>
        <p class="subtitle">
            I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
            I’d be happy to connect with you!
        </p>
        <div class="button-container">
            <a href="https://github.com/EJL20/" class="button" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/jaida-lebron/" class="button" target="_blank">LinkedIn</a>
            <a href="https://drive.google.com/file/d/14tbsoaDctrTKQeVzu-IpsGaRGY7VxXkU/view" class="button" target="_blank">Resume</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p class="name">Jaida Lebron</p>
        <p class="email">lebron.jaida@gmail.com</p>
    </div>
</body>
</html>
