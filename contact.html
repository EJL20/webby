<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ffd6e7, #fde7ff);
            overflow-x: hidden;
        }

        .wrapper {
            position: relative;
            width: 100%;
            height: 300vh; /* Adjust for three sections */
        }

        /* Top Background with Gradient Blend at Bottom */
        .background-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh; /* Full viewport height */
            background: url('1.png') no-repeat center center,
                        linear-gradient(to bottom, rgba(255, 255, 255, 0) 70%, rgba(253, 231, 255, 1));
            background-size: cover;
            z-index: 1;
        }

        }

        /* Blend Area */
        .blend-area {
            position: absolute;
            top: 200vh; /* Start just after the middle background */
            left: 0;
            width: 100%;
            height: 100vh; /* Full viewport height */
            background: url('2.png') no-repeat center center,
                        linear-gradient(to bottom, rgba(253, 231, 255, 0.8), rgba(253, 231, 255, 1));
            background-size: cover;
            z-index: 3;
        }

.background-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh; /* Full viewport height */
            background: url('2.png') no-repeat center center,
                        linear-gradient(to bottom, rgba(255, 255, 255, 0) 70%, rgba(253, 231, 255, 1));
            background-size: cover;
            z-index: 1;
}
        /* Content Section */
        .content {
            position: absolute;
            top: 250vh; /* Place content after blend area */
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 4;
        }

        .title {
            font-size: 2.5rem;
            color: #4b0082;
            margin: 1rem 0;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #6a0dad;
            margin: 1rem 0;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Top Background with Gradient Blend -->
        <div class="background-top"></div>

        <!-- Blend Area -->
        <div class="blend-area"></div>

        <!-- Content Section -->
        <div class="content">
            <h1 class="title">Hi, my name is 👋</h1>
            <h2 class="title">Jaida Lebron</h2>
            <p class="subtitle">
                I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
                I’d be happy to connect with you!
            </p>
            <div class="button-container">
                <a href="#" class="button" target="_blank">
                    <i>🐙</i> GitHub
                </a>
                <a href="#" class="button" target="_blank">
                    <i>🔗</i> LinkedIn
                </a>
                <a href="#" class="button" target="_blank">
                    <i>📄</i> Resume
                </a>
            </div>
        </div>
    </div>
</body>
</html>
