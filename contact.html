<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron - Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ffd6e7, #fde7ff);
            text-align: center;
        }

        .section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .full-width-image {
            width: 100%;
            max-height: 100vh;
            object-fit: cover; /* Ensures smooth blending */
            display: block;
        }

        .canva-container {
            position: relative;
            width: 80%; /* Adjust size */
            max-width: 1200px;
            margin-top: 2rem;
        }

        .canva-container iframe {
            width: 100%;
            height: 600px; /* Adjust height */
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(63, 69, 81, 0.16);
        }

        .content {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }

        .title {
            font-size: 2.5rem;
            color: #4b0082;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #6a0dad;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>

    <!-- First Image -->
    <div class="section">
        <img src="1.png" alt="Top Image" class="full-width-image">
    </div>

    <!-- Second Image (Blended) -->
    <div class="section">
        <img src="234.png" alt="Blended Image" class="full-width-image">
    </div>

    <!-- Canva Embed -->
    <div class="canva-container">
        <iframe loading="lazy" src="https://www.canva.com/design/DAGeElTQOxM/aEdFGZRS1_nq8oKoEjsWUQ/view?embed" allowfullscreen="allowfullscreen"></iframe>
    </div>

    <!-- Text Section -->
    <div class="content">
        <h1 class="title">Hi, my name is 👋</h1>
        <h2 class="title">Jaida Lebron</h2>
        <p class="subtitle">I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out. I’d be happy to connect with you!</p>
        
        <div class="button-container">
            <a href="#" class="button">🐙 GitHub</a>
            <a href="#" class="button">🔗 LinkedIn</a>
            <a href="#" class="button">📄 Resume</a>
        </div>
    </div>

</body>
</html>
