<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaida Lebron</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #ffd6e7, #fde7ff);
            overflow-x: hidden;
        }

        /* Wrapper */
        .wrapper {
            position: relative;
            width: 100%;
            height: 200vh; /* Ensures scrolling */
        }

        /* Top Image (Clouds - 1.png) */
        .background-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('1.png') no-repeat center center;
            background-size: cover;
            z-index: 2;
        }

        /* Overlay Transition (Fades out) */
        .overlay-transition {
            position: absolute;
            top: 100vh; /* Covers bottom image */
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('1.png') no-repeat center center;
            background-size: cover;
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
            z-index: 3;
        }

        /* Blending Area */
        .blend-area {
            position: absolute;
            top: 95vh;
            left: 0;
            width: 100%;
            height: 5vh;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 10%, rgba(253, 231, 255, 0.5) 90%);
            z-index: 3;
        }

        /* Bottom Image (2.png) */
        .background-bottom {
            position: absolute;
            top: 100vh;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('2.png') no-repeat center center;
            background-size: cover;
            z-index: 1; /* Lower than overlay */
        }

        /* Content */
        .content {
            position: absolute;
            top: 120vh;
            left: 10%;
            width: 80%;
            text-align: left;
            color: white;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 4;
        }

        /* Rise Effect */
        .rise-text {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .rise-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Buttons */
        .button-container {
            display: flex;
            justify-content: left;
            gap: 1rem;
            margin-top: 2rem;
        }

        .button {
            text-decoration: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            color: white;
            background-color: #4b0082;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #6a0dad;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Top Image -->
        <div class="background-top"></div>

        <!-- Overlay -->
        <div class="overlay-transition"></div>

        <!-- Blending Area -->
        <div class="blend-area"></div>

        <!-- Bottom Image -->
        <div class="background-bottom"></div>

        <!-- Content Section -->
        <div class="content">
            <div class="rise-text">
                <h1 class="title">Hi, my name is 👋</h1>
                <h2 class="title">Jaida Lebron</h2>
                <p class="subtitle">
                    I'm currently looking for full-time opportunities. If you'd like to get in touch, feel free to reach out.
                    I’d be happy to connect with you!
                </p>
            </div>

            <div class="button-container">
                <a href="https://github.com/EJL20/" class="button" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/in/jaida-lebron/" class="button" target="_blank">LinkedIn</a>
                <a href="https://drive.google.com/file/d/14tbsoaDctrTKQeVzu-IpsGaRGY7VxXkU/view" class="button" target="_blank">Resume</a>
            </div>
        </div>
    </div>

    <script>
        function isInViewport(element) {
            const rect = element.getBoundingClientRect();
            return rect.top < window.innerHeight && rect.bottom >= 0;
        }

        function handleScroll() {
            const riseText = document.querySelector('.rise-text');
            if (isInViewport(riseText)) {
                riseText.classList.add('visible');
            }
        }

        document.addEventListener("scroll", handleScroll);
        window.addEventListener("load", handleScroll);

        // Auto-scroll & Fade Overlay
        function autoScrollToBottom() {
            setTimeout(() => {
                window.scrollTo({
                    top: window.innerHeight,
                    behavior: "smooth"
                });

                // Fade out overlay
                setTimeout(() => {
                    let overlay = document.querySelector(".overlay-transition");
                    if (overlay) {
                        overlay.style.opacity = "0";
                        setTimeout(() => {
                            overlay.style.display = "none"; // Remove it
                        }, 1500);
                    }
                }, 1000);
            }, 3000);
        }

        window.addEventListener("load", autoScrollToBottom);
    </script>
</body>
</html>
