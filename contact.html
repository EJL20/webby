<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Embed Example</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        
        .canva-container {
            width: 80%;
            max-width: 900px;
        }

        iframe {
            width: 100%;
            height: 600px; /* Adjust height based on your design */
            border: none; /* Removes border for a cleaner look */
        }
    </style>
</head>
<body>

    <div class="canva-container">
        <!-- Replace this iframe src with your Canva embed link -->
        <iframe loading="lazy" src="https://www.canva.com/design/DAGeElTQOxM/aEdFGZRS1_nq8oKoEjsWUQ/view="allowfullscreen"></iframe>
    </div>

</body>
</html>
