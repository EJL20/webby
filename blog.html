<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- Wrapper -->
    <div class="wrapper">
        <h1 class="title">Welcome to My Blog <span class="wave">📖</span></h1>
        <p class="subtitle">
            Here, I share insights, projects, and experiences related to tech and development. Check out my latest posts below!
        </p>
        
        <section class="blog-container">
            <!-- Blog Post 1 -->
            <article class="blog-post">
                <a href="1stblog.html">
                    <img src="jaidaphoto.png" alt="Blog Image" class="blog-image">
                </a>
                <div class="blog-content">
                    <h2><a href="1stblog.html">Gamifying Hydration: Developing an App to Boost Water Intake</a></h2>
                    <h5>Dec 7, 2017</h5>
                    <p>A short introduction to my first blog post.</p>
                </div>
            </article>
        </section>
    </div>

    <!-- Dark Mode Toggle -->
    <div class="moon-icon" id="moon-icon">🌙</div>
    
    <script>
        // Dark mode toggle
        const moonIcon = document.getElementById("moon-icon");
        moonIcon.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");
            moonIcon.textContent = document.body.classList.contains("dark-mode") ? "🌕" : "🌙";

            // Store user preference
            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("dark-mode", "enabled");
            } else {
                localStorage.setItem("dark-mode", "disabled");
            }
        });

        // Check if dark mode was previously enabled
        if (localStorage.getItem("dark-mode") === "enabled") {
            document.body.classList.add("dark-mode");
        }
    </script>
</body>
</html>
