            <!-- Blog Post 2 -->
            <article class="blog-post">
                <a href="2ndblog.html">
                    <img src="jaidaphoto.png" alt="Blog Image" class="blog-image">

                <div class="blog-content">

    </main>

    <div class="moon-icon" id="moon-icon">🌙</div>

    <script>
        // Dark mode toggle
        const moonIcon = document.getElementById("moon-icon");

        // Check if dark mode was previously enabled and set it on load
        if (localStorage.getItem("dark-mode") === "enabled") {
            document.body.classList.add("dark-mode");
            moonIcon.textContent = "🌕"; // Update the moon icon to the sun
        } else {
            document.body.classList.remove("dark-mode");
            moonIcon.textContent = "🌙"; // Default moon icon
        }

        moonIcon.addEventListener("click", function () {
            document.body.classList.toggle("dark-mode");

            // Toggle the moon/sun icon based on the theme
            if (document.body.classList.contains("dark-mode")) {
                moonIcon.textContent = "🌕"; // Sun icon for dark mode
            } else {
                moonIcon.textContent = "🌙"; // Moon icon for light mode
            }

            // Store user preference in localStorage
            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("dark-mode", "enabled");
            } else {
                localStorage.setItem("dark-mode", "disabled");
            }
        });
    </script>
</body>
</html>
